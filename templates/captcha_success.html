<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Verification successful | BQSL</title>
    <style>
        :root {
            color-scheme: dark;
            --black: #050706;
            --green: #6dff8b;
            --muted-green: #9ed9aa;
            --white: #f5fff6;
            --line: #234d2d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--black);
            color: var(--green);
            font-family: "Courier New", Courier, monospace;
            text-align: center;
        }

        .success {
            width: min(100%, 620px);
            padding: clamp(32px, 8vw, 72px);
            border: 1px solid var(--line);
        }

        .status {
            margin: 0 0 24px;
            color: var(--muted-green);
            font-size: 0.8rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 7vw, 4.8rem);
            line-height: 1;
        }

        p {
            margin: 24px 0 36px;
            color: var(--white);
            font-family: Georgia, serif;
            font-size: 1.2rem;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            padding: 14px 18px;
            border: 1px solid var(--green);
            color: var(--black);
            background: var(--green);
            font-weight: 700;
            text-decoration: none;
        }

        a:hover,
        a:focus-visible {
            border-color: var(--white);
            color: var(--black);
            background: var(--white);
        }
    </style>
</head>
<body>
    <main class="success">
        <p class="status">BQSL / verification complete</p>
        <h1>Captcha passed.</h1>
        <p>The human verification challenge was completed successfully.</p>
        <a href="{{ url_for('home.html') }}">Continue to BQSL home</a>
    </main>
</body>
</html>
