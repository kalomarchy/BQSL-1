<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="BQSL Bitcoin verification research.">
    <title>BQSL | Home</title>
    <style>
        :root {
            color-scheme: dark;
            --black: #050706;
            --green: #6dff8b;
            --muted-green: #9ed9aa;
            --white: #f5fff6;
            --line: #234d2d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--black);
            color: var(--green);
            font-family: "Courier New", Courier, monospace;
        }

        main {
            width: min(100%, 760px);
            padding: clamp(32px, 8vw, 72px);
            border: 1px solid var(--line);
        }

        .label {
            margin: 0 0 24px;
            color: var(--muted-green);
            font-size: 0.8rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.8rem, 9vw, 6rem);
            line-height: 0.95;
        }

        p {
            max-width: 560px;
            margin: 28px 0 40px;
            color: var(--white);
            font-family: Georgia, serif;
            font-size: 1.25rem;
            line-height: 1.5;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        a {
            color: var(--white);
            text-underline-offset: 0.25em;
        }

        a:hover,
        a:focus-visible {
            color: var(--green);
        }

        .primary {
            padding: 14px 18px;
            border: 1px solid var(--green);
            color: var(--black);
            background: var(--green);
            font-weight: 700;
            text-decoration: none;
        }

        .primary:hover,
        .primary:focus-visible {
            color: var(--black);
            background: var(--white);
            border-color: var(--white);
        }
    </style>
</head>
<body>
    <main>
        <p class="label">Bitcoin Quantum Security Layer / home</p>
        <h1>BQSL</h1>
        <p>Explore human verification today and public, cryptographic Bitcoin verification next.</p>
        <nav aria-label="Home navigation">
            <a class="primary" href="index.html">Open the front page</a>
            <a href="/verify">Open the verifier</a>
        </nav>
    </main>
</body>
</html>
